<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>SkNest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden;background:#F3F5F8}
body{font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;font-size:13px;color:#1F2937;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.win{position:absolute;inset:0;border:1px solid #C9D0DA;display:flex;flex-direction:column;background:#F3F5F8}
.title{height:32px;background:#FFFFFF;display:flex;align-items:center;border-bottom:1px solid #E3E7ED;flex:none}
.title .logo{width:18px;height:18px;margin:0 9px 0 12px}
.title .t{font-size:12px;color:#374151;flex:1}
.title .wc{width:46px;height:32px;display:flex;align-items:center;justify-content:center;color:#374151}
.title .wc svg{width:10px;height:10px;stroke:currentColor;stroke-width:1;fill:none}
.tb{height:56px;background:#fff;border-bottom:1px solid #E3E7ED;display:flex;align-items:center;padding:0 8px;gap:8px;flex:none}
.btn{height:38px;padding:0 14px;border:1px solid #D8DDE5;border-radius:6px;background:#fff;display:flex;align-items:center;gap:7px;font-size:13px;color:#1F2937;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.btn.pri{background:#2563EB;border-color:#2563EB;color:#fff;font-weight:600;padding:0 18px}
.lvl{display:flex;align-items:center;gap:8px;margin-left:4px;font-size:13px}
.dd{height:42px;width:208px;border:1px solid #D8DDE5;border-radius:6px;padding:4px 12px;display:flex;align-items:center;justify-content:space-between;background:#fff}
.dd b{font-size:13px}.dd b span{color:#2563EB;font-weight:400;font-size:11px;margin-left:4px}.dd small{display:block;font-size:11px;color:#6B7280}
.tb .sp{flex:1}
.tb .proj{display:flex;align-items:center;gap:8px;color:#6B7280;font-size:12px;padding-right:6px}
.tb .proj .dot{width:8px;height:8px;border-radius:50%;background:#16A34A}
.main{flex:1;display:flex;min-height:0}
.nav{width:176px;background:#fff;border-right:1px solid #E3E7ED;display:flex;flex-direction:column;padding:8px 8px;flex:none}
.nav a{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;color:#1F2937;font-size:13.5px;margin-bottom:3px;text-decoration:none}
.nav a.on{background:#E3ECFD;color:#1D4ED8;font-weight:600;box-shadow:inset 3px 0 0 #2563EB}
.nav .grp{font-size:11.5px;color:#6B7280;padding:10px 12px 6px;border-top:1px solid #E5E7EB;margin-top:6px}
.nav .fill{flex:1}
.nav .sep{border-top:1px solid #E5E7EB;margin:6px 0}
.status{height:26px;background:#EEF1F5;border-top:1px solid #DDE2E9;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#374151;gap:18px;flex:none}
.status .ok{width:8px;height:8px;border-radius:50%;background:#16A34A;display:inline-block;margin-right:6px}
.status .r{margin-left:auto;color:#6B7280;display:flex;gap:18px}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.kpis{display:flex;gap:8px;padding:10px 12px;flex:none;border-bottom:1px solid #E3E7ED}
.kpi{background:#fff;border:1px solid #D8DDE5;border-radius:8px;padding:8px 12px 7px;min-width:96px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpi .l{font-size:11.5px;color:#4B5563}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.kpi .v small{font-size:13px;font-weight:600;margin-left:1px}
.kpi.g .v{color:#15803D}
.work{flex:1;display:flex;min-height:0}
.list{width:270px;border-right:1px solid #E3E7ED;display:flex;flex-direction:column;flex:none;background:#F3F5F8}
.tabs{display:flex;align-items:center;padding:10px 10px 8px;gap:8px}
.seg{display:flex;border:1px solid #D8DDE5;border-radius:7px;background:#fff;padding:2px}
.seg span{padding:5px 13px;border-radius:5px;font-size:12.5px}
.seg span.on{background:#2563EB;color:#fff;font-weight:600}
.mini{height:24px;padding:0 8px;border:1px solid #D8DDE5;border-radius:5px;background:#fff;font-size:11.5px;display:flex;align-items:center;margin-left:auto}
.scroll{flex:1;overflow:hidden;padding:0 10px;position:relative}
.ghead{background:#E8ECF2;border-radius:6px;padding:7px 10px;margin:4px 0 6px}
.ghead .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
.ghead .a .tri{font-size:8px;color:#6B7280;width:8px}
.ghead .a .sz{margin-left:auto;font-weight:400;color:#4B5563;font-size:11.5px}
.ghead .b{font-size:11px;color:#6B7280;margin-top:2px;padding-left:14px}
.pc{display:flex;gap:10px;background:#fff;border:1px solid #DDE3EA;border-radius:7px;padding:7px 8px;margin-bottom:6px;position:relative}
.pc.on{background:#E8F0FE;border-color:#A9C3F5;box-shadow:inset 3px 0 0 #2563EB}
.pc svg{flex:none;border-radius:2px}
.pc .m{flex:1;min-width:0}
.pc .m .h{display:flex;align-items:center;justify-content:space-between}
.pc .m .h b{font-size:12.5px;color:#1D4ED8}

.pc .m .s{font-size:11px;color:#6B7280;line-height:16px}
.pc .m .u{font-size:11px;color:#374151;line-height:16px}
.pc .m .u b{color:#15803D;font-weight:600}
.vbar{position:absolute;right:2px;top:4px;width:5px;height:180px;border-radius:3px;background:#C7CED8}
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:#F7F8FA}
.phead{height:42px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #E3E7ED;background:#fff;font-size:12.5px;color:#6B7280;white-space:nowrap}
.phead b{color:#111827}
.phead .ttl{font-size:14px;font-weight:700;color:#111827}
.tog{height:40px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #E3E7ED;background:#fff;font-size:12.5px;white-space:nowrap}
.sw{display:inline-flex;align-items:center;gap:7px}
.sw i{width:34px;height:18px;border-radius:9px;background:#fff;border:1.5px solid #374151;position:relative;display:inline-block}
.sw i:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#111827;top:2.5px;left:3px}
.sw.on i{background:#2563EB;border-color:#2563EB}

.vs{width:1px;height:20px;background:#E3E7ED}
.sbtn{height:26px;padding:0 10px;border:1px solid #D8DDE5;border-radius:5px;background:#fff;display:flex;align-items:center;gap:5px;font-size:12px}
.canvas{flex:1;position:relative;overflow:hidden}
.legend{display:flex;gap:14px;font-size:11.5px;color:#4B5563;align-items:center}
.legend i{display:inline-block;width:12px;height:10px;border:1px solid #8AA6C4;vertical-align:-1px;margin-right:4px}
.ptable{position:absolute;left:14px;right:14px;background:#fff;border:1px solid #DDE3EA;border-radius:8px;overflow:hidden}
.ptable .hd{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid #E5E9EF;font-weight:700;font-size:12.5px;gap:10px}
.ptable .hd span{font-weight:400;color:#6B7280;font-size:11.5px}
table{border-collapse:collapse;width:100%}
th{font-weight:600;color:#4B5563;background:#F5F7FA;text-align:left;font-size:11.5px;padding:0 8px;height:24px;border-bottom:1px solid #E5E9EF;white-space:nowrap}
td{font-size:12px;padding:0 8px;height:23px;border-bottom:1px solid #EEF1F5;white-space:nowrap;font-variant-numeric:tabular-nums}
.drawer{width:322px;border-left:1px solid #E3E7ED;background:#fff;display:flex;flex-direction:column;flex:none}
.drawer .dh{height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #E3E7ED;font-weight:700;font-size:13.5px}
.drawer .dh .x{margin-left:auto;color:#6B7280}
.sum{padding:10px 14px 6px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border-bottom:1px solid #E3E7ED}
.sum div{font-size:11.5px;color:#6B7280}
.sum div b{display:block;font-size:14px;color:#111827;font-weight:600;margin-top:1px}
.bar{height:6px;border-radius:3px;background:#E5E9EF;grid-column:1/3;overflow:hidden;display:flex;margin-top:2px}
.steps{flex:1;display:flex;flex-direction:column;min-height:0}
.steps .sh{display:flex;align-items:center;gap:6px;padding:8px 14px;font-weight:700;font-size:12.5px}
.steps .sh .sbtn{margin-left:auto}
.steps .tw{flex:1;overflow:hidden;position:relative;border-top:1px solid #E5E9EF}
.steps tr.cur td{background:#DBE8FD;color:#1E3A8A;font-weight:600}
.steps td.dir{color:#374151}
.sbar2{position:absolute;right:2px;top:28px;width:5px;height:120px;border-radius:3px;background:#C7CED8}
</style></head>
