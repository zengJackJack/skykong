:root{--blue:#2563EB;--bg:#F3F5F8;--bd:#DCE1E8;--tx:#1F2937;--mu:#6B7280;--li:#ECEFF3}
*{box-sizing:border-box}
html,body{width:1600px;height:1000px;margin:0;overflow:hidden;background:var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;font-size:13px;color:var(--tx)}
.win{width:1600px;height:1000px;display:flex;flex-direction:column}
.title{height:30px;flex:none;background:#fff;border-bottom:1px solid #E3E7ED;display:flex;align-items:center;padding-left:10px;font-size:12px;color:#374151}
.title .logo{width:16px;height:16px;border-radius:3px;background:var(--blue);display:flex;align-items:center;justify-content:center;margin-right:8px}
.title .t{flex:1}
.wb{width:46px;height:30px;display:flex;align-items:center;justify-content:center}
.body{flex:1;display:flex;min-height:0}
.nav{width:172px;flex:none;background:#fff;border-right:1px solid #E3E7ED;display:flex;flex-direction:column;padding:8px 8px}
.ni{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px;font-size:13.5px;color:#273142;margin-bottom:3px}
.ni svg{width:20px;height:20px;flex:none;fill:none;stroke:#2A3340;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.ni.on{background:#E2EAFB;color:#1D4ED8;font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.ni.on svg{stroke:#1D4ED8}
.nsep{border-top:1px solid #E3E7ED;margin:6px 4px 8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px 0}
.appbar{height:22px;flex:none;background:#F7F8FA;border-top:1px solid #E3E7ED;display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:#4B5563;gap:14px}
.appbar .r{margin-left:auto;color:#6B7280;display:flex;gap:16px}
.hdr{height:36px;flex:none;display:flex;align-items:center;gap:8px}
.hdr h1{font-size:19px;font-weight:400;margin:0 auto 0 0;color:#111827}
.b{height:28px;padding:0 13px;border:1px solid #CDD3DC;background:#fff;border-radius:3px;display:inline-flex;align-items:center;font-size:12.5px;white-space:nowrap;color:#1F2937}
.b.pri{background:var(--blue);border-color:var(--blue);color:#fff;min-width:96px}
.ck{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;margin:0 3px}
.ck i{width:16px;height:16px;border:1.4px solid #4B5563;border-radius:3px;background:#fff;display:inline-block;position:relative;flex:none}
.ck i.on{background:#1A73E8;border-color:#1A73E8}
.ck i.on:after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.card{background:#fff;border:1px solid #E1E5EB;border-radius:6px}
.stl{height:34px;flex:none;display:flex;align-items:center;font-size:12.5px;color:#1F2937}

.bcard{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px 14px;margin-top:8px}
.bh{font-size:13px;font-weight:600;margin-bottom:6px}
.brow{display:flex;align-items:center;gap:10px;height:32px;font-size:12.5px}
.pg{width:26px;height:26px;border:1px solid #CDD3DC;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.leg{margin-left:auto;display:flex;gap:12px;font-size:12px;color:#4B5563}
.leg i{display:inline-block;width:12px;height:12px;border:1px solid;border-radius:2px;margin-right:5px;vertical-align:-2px}
.cv{flex:1;margin-top:8px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;position:relative}
.zoom{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:#6B7280;background:#fff;border:1px solid #DCE1E8;border-radius:3px;padding:2px 8px}
